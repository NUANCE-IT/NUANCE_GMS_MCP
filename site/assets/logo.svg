<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img"
     aria-label="nuance-mcp logo">
  <title>nuance-mcp</title>
  <desc>NUANCE-MCP logomark: a stylised electron column over a tool-graph node ring.</desc>

  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="#4E2A84"/>

  <!-- Outer column ring -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.18" stroke-width="3"/>

  <!-- Electron column: tapering condensers down to a focused probe -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer lens -->
    <path d="M 64 60 Q 128 32 192 60 L 168 80 Q 128 60 88 80 Z"
          stroke-width="3" fill="#FFFFFF" fill-opacity="0.10"/>
    <!-- Middle lens -->
    <path d="M 80 96 Q 128 80 176 96 L 156 112 Q 128 100 100 112 Z"
          stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.08"/>
    <!-- Probe beam to specimen -->
    <line x1="128" y1="112" x2="128" y2="160" stroke-width="3"/>
    <!-- Specimen line -->
    <line x1="84" y1="166" x2="172" y2="166" stroke-width="2.5"/>
    <!-- Outgoing diffracted beams -->
    <line x1="128" y1="166" x2="100" y2="208" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="128" y1="166" x2="156" y2="208" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="128" y1="166" x2="128" y2="210" stroke-width="2.4"/>
  </g>

  <!-- Tool-graph nodes around the ring (5 nodes for 5 capability families) -->
  <g fill="#FFFFFF">
    <circle cx="128" cy="36"  r="6"/>
    <circle cx="220" cy="128" r="6"/>
    <circle cx="184" cy="216" r="6"/>
    <circle cx="72"  cy="216" r="6"/>
    <circle cx="36"  cy="128" r="6"/>
  </g>

  <!-- Subtle connection arcs between nodes (only top half) -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.5">
    <path d="M 128 36 A 92 92 0 0 1 220 128"/>
    <path d="M 36 128 A 92 92 0 0 1 128 36"/>
  </g>

  <!-- Wordmark dot — small probe-on-detector accent -->
  <circle cx="128" cy="216" r="3.5" fill="#FFC72C"/>
</svg>
