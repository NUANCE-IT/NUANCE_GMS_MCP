<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img"
     aria-label="nuance-mcp banner">
  <title>nuance-mcp — A vendor-agnostic schema-bound MCP server for multimodal electron microscopy</title>
  <desc>NUANCE-MCP banner: logomark on the left, tagline on the right.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4E2A84"/>
      <stop offset="55%"  stop-color="#39205F"/>
      <stop offset="100%" stop-color="#1F1131"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFC72C"/>
      <stop offset="100%" stop-color="#E6A91E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" rx="0" fill="url(#bg)"/>

  <!-- Subtle reciprocal-space dot pattern, decorative -->
  <g fill="#FFFFFF" fill-opacity="0.06">
    <circle cx="900"  cy="80"  r="3"/>
    <circle cx="970"  cy="60"  r="2.5"/>
    <circle cx="1040" cy="100" r="2"/>
    <circle cx="1100" cy="60"  r="3"/>
    <circle cx="1160" cy="90"  r="2.5"/>
    <circle cx="1220" cy="60"  r="2"/>
    <circle cx="950"  cy="170" r="2.5"/>
    <circle cx="1020" cy="200" r="3"/>
    <circle cx="1090" cy="170" r="2"/>
    <circle cx="1160" cy="200" r="2.5"/>
    <circle cx="980"  cy="260" r="2"/>
    <circle cx="1050" cy="280" r="3"/>
    <circle cx="1120" cy="260" r="2"/>
    <circle cx="1190" cy="280" r="2.5"/>
  </g>

  <!-- Logomark (scaled 256 viewBox into 240px square at x=40) -->
  <g transform="translate(40, 40)">
    <rect width="240" height="240" rx="36" fill="#4E2A84"/>
    <circle cx="120" cy="120" r="86" fill="none" stroke="#FFFFFF"
            stroke-opacity="0.18" stroke-width="3"/>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 60 56 Q 120 30 180 56 L 158 76 Q 120 56 82 76 Z"
            stroke-width="3" fill="#FFFFFF" fill-opacity="0.10"/>
      <path d="M 75 90 Q 120 76 165 90 L 146 104 Q 120 94 94 104 Z"
            stroke-width="2.5" fill="#FFFFFF" fill-opacity="0.08"/>
      <line x1="120" y1="104" x2="120" y2="150" stroke-width="3"/>
      <line x1="79"  y1="156" x2="161" y2="156" stroke-width="2.5"/>
      <line x1="120" y1="156" x2="94"  y2="196" stroke-width="2" stroke-opacity="0.55"/>
      <line x1="120" y1="156" x2="146" y2="196" stroke-width="2" stroke-opacity="0.55"/>
      <line x1="120" y1="156" x2="120" y2="198" stroke-width="2.4"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="120" cy="34"  r="6"/>
      <circle cx="206" cy="120" r="6"/>
      <circle cx="172" cy="202" r="6"/>
      <circle cx="68"  cy="202" r="6"/>
      <circle cx="34"  cy="120" r="6"/>
    </g>
    <circle cx="120" cy="202" r="3.5" fill="#FFC72C"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
     font-weight="700" fill="#FFFFFF">
    <text x="340" y="148" font-size="86" letter-spacing="-2">
      nuance<tspan fill="url(#accent)">-mcp</tspan>
    </text>
    <text x="343" y="200" font-size="22" font-weight="400"
          fill="#FFFFFF" fill-opacity="0.78">
      A vendor-agnostic, schema-bound Model Context Protocol server for
    </text>
    <text x="343" y="226" font-size="22" font-weight="400"
          fill="#FFFFFF" fill-opacity="0.78">
      local LLM-orchestrated multimodal electron microscopy.
    </text>
    <text x="343" y="270" font-size="16" font-weight="500"
          fill="#FFFFFF" fill-opacity="0.55" letter-spacing="2">
      GATAN · JEOL · HITACHI · SIMULATOR · 30 TOOLS · 6 SKILLS · 5 LIVE-JOB CLASSES
    </text>
  </g>
</svg>
