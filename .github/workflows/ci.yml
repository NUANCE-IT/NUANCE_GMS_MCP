name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Lint + typecheck — runs once on 3.12
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: ruff format check
        run: ruff format --check .

      - name: ruff lint
        run: ruff check .

      - name: Install package for mypy
        run: pip install -e ".[ollama,voice,gatan,jeol]" || pip install -e .

      - name: mypy
        run: mypy --install-types --non-interactive src/nuance_mcp || mypy src/nuance_mcp

  # ---------------------------------------------------------------------------
  # Test matrix — 3.10 / 3.11 / 3.12 on Ubuntu, plus macOS 3.12
  # ---------------------------------------------------------------------------
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with ZMQ extra for adapter import-tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gatan]"
          pip install pytest pytest-asyncio pytest-cov

      - name: Hardware-independent test suite
        env:
          # Belt-and-braces: keep the simulator in charge even if a CI
          # runner somehow has PyJEM installed.
          NUANCE_MCP_JEOL_MODE: offline
        run: pytest tests/ -q -m "not ollama" --cov=nuance_mcp --cov-report=xml

      - name: Project status probe
        # Shares its source of truth with the /goals slash command:
        # scripts/project_status.py. --no-tests because the suite already
        # ran above; this step gates on the protocol surface importing
        # cleanly and prints the milestone roadmap into the CI log.
        env:
          NUANCE_MCP_JEOL_MODE: offline
        run: python scripts/project_status.py --no-tests

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Ollama integration tests — opt-in, gated on a model being available
  # ---------------------------------------------------------------------------
  ollama-integration:
    name: Ollama integration (${{ matrix.model }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        model: ["qwen2.5:7b", "llama3.2", "gemma3"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ollama daemon
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull ${{ matrix.model }}

      - name: Install package with Ollama extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ollama]"
          pip install pytest pytest-asyncio

      - name: Run Ollama integration suite
        env:
          OLLAMA_MODEL: ${{ matrix.model }}
          OLLAMA_BASE_URL: http://127.0.0.1:11434
        run: pytest tests/ -q -m ollama

  # ---------------------------------------------------------------------------
  # Build distribution wheel + sdist on tagged releases
  # ---------------------------------------------------------------------------
  build:
    name: Build wheel & sdist
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Upload built artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # ---------------------------------------------------------------------------
  # PyPI publish — manual, after build (needs trusted-publisher config)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish via OIDC trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
